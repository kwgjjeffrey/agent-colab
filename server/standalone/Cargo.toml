[workspace]
members = ["crates/api", "crates/domain", "crates/persistence", "crates/auth", "crates/email"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "form", "query", "rustls", "system-proxy"] }
sha2 = "0.10.9"
hex = "0.4.3"
base64 = "0.22.1"
thiserror = "2.0.17"
async-trait = "0.1.89"
lettre = { version = "0.11.19", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
minijinja = "2.12.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "migrate", "macros", "uuid"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "net", "fs", "io-util", "time", "sync"] }
tokio-util = { version = "0.7.17", features = ["io"] }
futures-util = "0.3.31"
tower-http = { version = "0.7.1", features = ["catch-panic", "limit", "request-id", "timeout"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
