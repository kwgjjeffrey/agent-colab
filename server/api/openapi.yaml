openapi: 3.1.0
info:
  title: Colab Server API
  version: 0.1.0
paths:
  /v1/auth/external/config:
    get:
      operationId: externalIdentityProvider
      description: Optional deployment-configured browser authorization endpoint; never includes broker credentials.
      responses:
        '200':
          description: External provider configuration
          content:
            application/json:
              schema:
                type: object
                required: [provider, displayName, authorizationUrl]
                properties:
                  provider: {type: string}
                  displayName: {type: string}
                  authorizationUrl: {type: string, format: uri}
        '404': {description: External login is not configured}
  /v1/auth/external/session:
    post:
      operationId: exchangeExternalLogin
      description: Redeems a one-time PKCE-bound authorization code through the configured trusted broker. Optional existing Colab bearer plus explicit broker confirmation links an identity without changing the account UUID. Provider identity mapping and normal session issuance remain Server-owned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, codeVerifier, redirectUri]
              properties:
                code: {type: string, maxLength: 256}
                codeVerifier: {type: string, minLength: 43, maxLength: 128}
                redirectUri: {type: string, format: uri, maxLength: 256}
      responses:
        '200': {description: Standard Colab session and account identity}
        '401': {description: Invalid grant, identity, or existing account proof}
        '404': {description: External login is not configured}
        '409': {description: Identity linking conflicts with an existing account}
  /v1/channels/{channelId}/catalog-items:
    get:
      operationId: listCatalogItems
      description: Authorized mixed direct children, ordered and paginated. Catalog childCount counts only direct visible Catalogs, non-archived Canvas and active shared items. Shared items include contributorMemberId, contributorName and contributorAvatarUrl from account identity. Stable item IDs are unchanged.
      parameters:
        - {name: channelId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: parentId, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, maximum: 200}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
      responses:
        '200': {description: Mixed children with nullable childCount and contributor metadata}
        '403': {description: Not authorized}
  /v1/channels/{channelId}/catalog-items/position:
    patch:
      operationId: positionCatalogItem
      description: Atomically move an authorized item and insert before an optional direct sibling. Omitted before appends; null parentId moves to root. Stable item and consumer identities are unchanged.
      parameters:
        - {name: channelId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, itemId]
              properties:
                kind: {type: string, enum: [catalog, canvas, session, files, skill]}
                itemId: {type: string, format: uuid}
                parentId: {type: [string, 'null'], format: uuid}
                before:
                  type: object
                  required: [kind, itemId]
                  properties:
                    kind: {type: string, enum: [catalog, canvas, session, files, skill]}
                    itemId: {type: string, format: uuid}
      responses:
        '204': {description: Placement committed}
        '400': {description: Invalid or stale anchor, invalid destination, cycle or unavailable item; no partial move}
        '403': {description: Not authorized}
  /v1/auth/profile:
    get:
      operationId: getAccountProfile
      description: Authenticated current account profile with authoritative Google linkage. No user ID supplied by caller.
      responses:
        "200": { description: "id, email, displayName, avatarUrl, nameCustomized, googleLinked, profileManaged (enterprise identity owns profile; PATCH returns 403)" }
    patch:
      operationId: updateAccountName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                displayName: { type: string, minLength: 1, maxLength: 80 }
                avatarUrl: { type: string, maxLength: 90000, pattern: '^data:image/jpeg;base64,' }
                resetAvatar: { type: boolean }
              description: Exactly one action per request; set name, upload bounded JPEG data, or resetAvatar true. Explicit avatar choices survive Google login.
      responses:
        "200": { description: Updated current-account profile; explicit name survives provider logins }
        "400": { description: Invalid display name }
  /v1/channels/{channelId}/activity:
    get:
      operationId: listChannelActivity
      description: Current authorized shared items, latest successful Files/Session consumption per reader and object, Canvas creation, and durable Agent command records. Stable actor/target identities and bounded (160 text characters, 40 nodes) rich instruction previews preserve mention capsules. No Session/File/Canvas bodies or tool logs. Withdrawn resources are omitted.
      parameters:
        - { name: channelId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 }, description: "Numbered pagination. Returns total/page/pageSize; cannot combine with cursors. Out-of-range pages clamp to the last page." }
        - { name: before, in: query, schema: { type: string, format: date-time } }
        - { name: beforeId, in: query, schema: { type: string } }
      responses:
        "200": { description: "items with id/action/actorName/actorMemberId/resourceKind/resourceId/resourceName/occurredAt/targetName/targetBlueprintId/previewContent/source/state and nullable nextCursor {before,beforeId}; numbered queries also return total/page/pageSize; newest first" }
        "400": { description: Invalid pagination cursor }
        "403": { description: Caller is not a Channel member }
  /v1/shares/{shareId}/read-activity:
    post:
      operationId: recordShareRead
      description: Local Core reports successful Files or Session consumption. Actor comes from authenticated account; repeated reads coalesce. Not a complete security audit; reporting failure never fails the original read.
      parameters:
        - { name: shareId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Latest consumption time recorded }
        "403": { description: Share withdrawn, unsupported, or caller not a member }
  /v1/channels/{channelId}/organization/people:
    get:
      description: Search authorized organization people. Optional enterprise directory returns verified identity, username, avatarUrl and department; public mode returns existing userId/email/profile.
      parameters:
        - { name: channelId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: q, in: query, schema: { type: string, maxLength: 128 } }
      responses:
        "200": { description: Array of people; identity is provider/subject, optional userId for a registered account }
        "403": { description: Not a Channel member }
  /v1/channels/{channelId}/members:
    post:
      description: Public mode accepts email/role. Enterprise mode requires identity (provider/subject) and role, revalidates active employee through the directory, and provisions a dormant account if needed. No login session is created. Duplicate selection preserves role.
      parameters:
        - { name: channelId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Member joined }
        "202": { description: Public email invitation queued }
        "400": { description: Invalid person selection }
        "403": { description: Not a Channel administrator }
  /health/live:
    get:
      operationId: getLiveness
      responses:
        "200": { description: Process is alive }
  /health/ready:
    get:
      operationId: getReadiness
      responses:
        "200": { description: Process and PostgreSQL are ready }
        "503":
          description: A required dependency is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/status:
    get:
      operationId: getServerStatus
      responses:
        "200":
          description: Server status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceStatus"
  /v1/auth/session/refresh:
    post:
      operationId: refreshSession
      description: Atomically rotate an opaque access/refresh token pair. Refresh tokens are one-time capabilities; replay revokes the session family.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: Rotated session credentials
        "401":
          description: Unknown, revoked, or replayed refresh token
  /v1/organizations:
    get:
      operationId: listOrganizations
      responses:
        "200":
          description: Organizations represented by the authenticated user's memberships
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Organization" }
    post:
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "201":
          description: Organization and owner membership created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
  /v1/organizations/{organizationId}/channels:
    parameters:
      - name: organizationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listOrganizationChannels
      responses:
        "200":
          description: Channels visible through the authenticated user's Organization Member
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Channel" }
  /v1/channels/{channelId}/files:
    parameters:
      - name: channelId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listFileShares
      responses:
        "200":
          description: Active Files shared items in the Channel
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/FileShare" } }
    post:
      operationId: createFileShare
      responses:
        "201":
          description: Files shared item registered
  /v1/files/{shareId}/revisions:
    parameters:
      - name: shareId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listFileRevisions
      responses:
        "200": { description: Ordered Git revision chain }
    post:
      operationId: uploadFileRevision
      parameters:
        - { name: rootOid, in: query, required: true, schema: { type: string } }
        - { name: parentRootOid, in: query, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/x-git-packed-objects:
            schema: { type: string, format: binary }
      responses:
        "201": { description: Revision accepted and current root advanced }
        "409": { description: Parent root does not match current root }
  /v1/file-revisions/{revisionId}/content:
    get:
      operationId: downloadFileRevisionPack
      parameters:
        - name: revisionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Git pack for this revision
          content:
            application/x-git-packed-objects:
              schema: { type: string, format: binary }
  /v1/channels/{channelId}/sessions:
    get:
      operationId: listSessionShares
      responses:
        "200": { description: Active Session shared items in the Channel }
    post:
      operationId: createSessionShare
      responses:
        "201": { description: Session shared item registered }
  /v1/sessions/{shareId}/segments:
    get:
      operationId: getSessionSnapshotManifest
      responses:
        "200": { description: Current immutable snapshot, chunkProtocol 2 negotiation, optional opaque readIndex metadata, and ordered segment chain with codec and encoded/decoded integrity metadata }
    post:
      operationId: appendSessionSegment
      parameters:
        - { name: codec, in: query, schema: { type: string, enum: [identity, zstd], default: identity } }
        - { name: decodedByteSize, in: query, schema: { type: integer, minimum: 1, maximum: 41943040 }, description: Required only for zstd; source cursor remains in decoded bytes }
        - { name: decodedDigest, in: query, schema: { type: string, pattern: '^[0-9a-f]{64}$' }, description: Required only for zstd; digest still hashes encoded transport bytes }
      responses:
        "201": { description: Immutable segment integrity verified and snapshot CAS advanced }
        "409": { description: Parent snapshot does not match current snapshot }
  /v1/session-segments/{segmentId}/content:
    get:
      operationId: downloadSessionSegment
      parameters:
        - { name: encoded, in: query, schema: { type: boolean, default: false }, description: Return stored frame bytes; false preserves legacy raw provider bytes using streaming decoding }
      responses:
        "200":
          description: Opaque provider JSONL segment streamed from Blob storage
  /v1/sessions/{shareId}/read-index:
    post:
      operationId: publishSessionReadIndex
      description: Owner-only immutable Zstd byte-locator projection for the current snapshot; exact retry reuses the committed object. No provider transcript parsing occurs on Server.
      parameters:
        - { name: snapshotId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: digest, in: query, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' } }
        - { name: decodedDigest, in: query, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' } }
        - { name: decodedByteSize, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 41943040 } }
      responses:
        "200": { description: Committed immutable read-index metadata }
        "403": { description: Only the publication owner may publish or recover an index acknowledgement }
        "409": { description: Snapshot changed or a different index already committed }
  /v1/session-read-indexes/{indexId}/content:
    get:
      operationId: downloadSessionReadIndex
      responses:
        "200": { description: Opaque compressed locator projection; current Channel authorization required }
        "403": { description: No active reference accessible to this account }
  /v1/channels/{channelId}/skills:
    get:
      operationId: listSkillShares
      responses:
        "200": { description: Active Skill shared items in the Channel }
    post:
      operationId: createSkillShare
      responses:
        "201": { description: Skill shared item registered }
  /v1/skills/{shareId}/revisions:
    get:
      operationId: listSkillRevisions
      responses:
        "200": { description: Ordered opaque shadow-Git revision chain }
    post:
      operationId: uploadSkillRevision
      responses:
        "201": { description: Skill revision accepted and current root advanced }
        "409": { description: Parent root does not match current root }
  /v1/skill-revisions/{revisionId}/content:
    get:
      operationId: downloadSkillRevisionPack
      responses:
        "200": { description: Opaque Git pack for this Skill revision }
  /v1/skills/{shareId}:
    delete:
      operationId: withdrawSkillShare
      responses:
        "204": { description: Owned Skill shared item withdrawn }
  /v1/channels/{channelId}/participants:
    get:
      operationId: listChannelMessageParticipants
      summary: List Channel members, current member first, with selected Agent counts
      responses:
        "200": { description: Channel participants visible to the authenticated Organization Member }
  /v1/channels/{channelId}/blueprints:
    get:
      operationId: listChannelAgentBlueprints
      summary: List one member's Organization-wide Agent blueprints with Channel selection state
      parameters:
        - { name: owner_member_id, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Agent blueprints visible in this Channel }
    post:
      operationId: createAgentBlueprint
      responses:
        "201": { description: Personal Agent blueprint created }
  /v1/channels/{channelId}/blueprints/{blueprintId}:
    patch:
      operationId: updateAgentBlueprint
      responses:
        "200": { description: Owned Agent blueprint updated }
  /v1/channels/{channelId}/blueprints/{blueprintId}/selection:
    patch:
      operationId: setChannelAgentSelection
      responses:
        "204": { description: Owned Agent added to or removed from this Channel }
  /v1/channels/{channelId}/messages:
    get:
      operationId: listChannelMessages
      parameters:
        - { name: after, in: query, required: false, schema: { type: integer, format: int64, default: 0 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        "200": { description: Messages after the monotonic Channel cursor }
    post:
      operationId: createChannelMessage
      responses:
        "201": { description: Idempotent member message committed }
  /v1/messages/stream:
    get:
      operationId: streamMessageInvalidations
      summary: Upgrade to an authenticated WebSocket carrying non-authoritative cursor invalidations
      responses:
        "101": { description: WebSocket protocol switched }
  /v1/transfers:
    post:
      operationId: createQuickTransfer
      summary: Create an anonymous, expiring capability-scoped transfer
      responses:
        "201": { description: Separate upload, read, and revoke capabilities }
        "429": { description: Rolling anonymous creation limit exceeded }
  /v1/transfers/{transferId}/items:
    post:
      operationId: addQuickTransferItem
      summary: Register one Files, Session, or Skill item using the upload capability
      responses:
        "201": { description: Empty item registered for streaming upload }
  /v1/transfers/{transferId}/items/{itemId}/content:
    put:
      operationId: uploadQuickTransferItem
      summary: Stream one opaque item to immutable Blob storage
      responses:
        "204": { description: Item accepted, hashed, and committed }
    get:
      operationId: downloadQuickTransferItem
      summary: Stream one item using the read capability
      responses:
        "200": { description: Opaque item bytes }
  /v1/transfers/{transferId}/finalize:
    post:
      operationId: finalizeQuickTransfer
      responses:
        "204": { description: Fixed snapshot made readable }
        "409": { description: One or more registered items are incomplete }
  /v1/transfers/{transferId}:
    get:
      operationId: getQuickTransferManifest
      responses:
        "200": { description: Ordered fixed-snapshot manifest }
    delete:
      operationId: revokeQuickTransfer
      responses:
        "204": { description: Transfer revoked; Blob GC follows asynchronously }
  /v1/transfers/{transferId}/manage:
    get:
      operationId: manageQuickTransfer
      summary: Read creator-only metadata and aggregated usage with the revoke capability
      responses:
        "200": { description: Fixed item, current expiry, state, and hashed-reader access summaries }
    patch:
      operationId: updateQuickTransferExpiry
      summary: Replace the remaining lifetime of an active transfer with the revoke capability
      responses:
        "200": { description: Updated expiry }
  /v1/organizations/{organizationId}/agent-runtimes/register:
    post:
      operationId: registerAgentRuntime
      summary: Register one installed coding-agent target on one physical device
      responses:
        "200": { description: Stable member-device-provider runtime registration }
  /v1/channels/{channelId}/agent-runtimes:
    get:
      operationId: listAgentRuntimes
      responses:
        "200": { description: Current member's registered runtimes across devices }
  /v1/channels/{channelId}/agent-requests:
    get:
      operationId: listAgentRequests
      summary: Read Channel Agent task history newest first, including Canvas commands
      responses:
        "200": { description: All authorized Channel requests with id, targetBlueprintId, state, summary, createdAt, nullable startedAt and finishedAt, and nullable durationMs. Working means runtime-acknowledged running. Unknown legacy timing remains null. }
    post:
      operationId: createAgentRequest
      summary: Bind forwarded messages to one Channel Agent; rich-message mentions route during message commit
      responses:
        "201": { description: Durable request queued or awaiting owner approval }
  /v1/agent-runtimes/{runtimeId}/stream:
    get:
      operationId: streamAgentRuntimeCommands
      summary: Upgrade to the authenticated command WebSocket for one exact device runtime
      responses:
        "101": { description: WebSocket protocol switched; client acknowledges each complete command on the same socket and unacknowledged PostgreSQL claims replay on reconnect }
  /v1/agent-requests/{requestId}/context:
    get:
      operationId: readAgentRequestContext
      responses:
        "200": { description: Older authorized Channel messages }
  /v1/agent-requests/{requestId}/reply:
    post:
      operationId: replyToAgentRequest
      responses:
        "201": { description: Idempotent Agent result committed to the source Channel }
  /v1/agent-requests/{requestId}/fail:
    post:
      operationId: failAgentRequest
      summary: Move a claimed request out of running after provider execution fails
      responses:
        "204": { description: Request marked failed; raw local diagnostics are not published }
  /v1/agent-requests/{requestId}/complete:
    post:
      operationId: completeAgentRequest
      summary: Record provider completion without publishing its native final response to the Channel
      responses:
        "204": { description: Runtime execution marked complete }
  /v1/agent-requests/{requestId}/events:
    get:
      operationId: readAgentRequestWorkDetails
      summary: Read provider events captured for one durable Agent request
      responses:
        "200": { description: Task-scoped work details }
    post:
      operationId: saveAgentRequestWorkDetails
      summary: Persist bounded provider events from the owning local runtime
      responses:
        "204": { description: Work details saved }
  /v1/channels/{channelId}/canvases:
    get:
      operationId: listCanvases
      summary: List collaborative documents visible in a Channel
      responses:
        "200": { description: Canvas metadata ordered by latest durable update }
    post:
      operationId: createCanvas
      responses:
        "201": { description: Empty Canvas metadata created }
  /v1/channels/{channelId}/canvas-folders:
    get:
      operationId: listCanvasFolders
      responses:
        "200": { description: Authorized Canvas folders }
    post:
      operationId: createCanvasFolder
      responses:
        "201": { description: Canvas folder created }
  /v1/canvases/{canvasId}:
    patch:
      operationId: renameCanvas
      summary: Rename an authorized Canvas document in place
      responses:
        "200": { description: Renamed Canvas metadata }
  /v1/canvas-folders/{folderId}:
    patch:
      operationId: renameCanvasFolder
      summary: Rename an authorized Canvas folder in place
      responses:
        "200": { description: Renamed Canvas folder }
  /v1/canvases/{canvasId}/updates:
    get:
      operationId: listCanvasUpdates
      summary: Repair a replica from the authoritative per-Canvas server sequence
      responses:
        "200": { description: Ordered Yjs update-v1 records after the requested sequence }
    post:
      operationId: appendCanvasUpdate
      summary: Idempotently persist one bounded Yjs update-v1 record
      responses:
        "201": { description: Durable update and assigned server sequence }
components:
  schemas:
    Organization:
      type: object
      required: [id, memberId, name, role, createdAt]
      properties:
        id: { type: string, format: uuid }
        memberId: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, enum: [owner, admin, member] }
        createdAt: { type: string }
    Channel:
      type: object
      required: [id, name, role, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        icon: { type: [string, "null"] }
        role: { type: string, enum: [owner, admin, member] }
        createdAt: { type: string }
    FileShare:
      type: object
      required: [id, channelId, name, contributorName, state, canWithdraw, updatedAt]
      properties:
        id: { type: string, format: uuid }
        channelId: { type: string, format: uuid }
        name: { type: string }
        contributorName: { type: string }
        state: { type: string, enum: [active, withdrawn] }
        currentRootOid: { type: [string, "null"] }
        canWithdraw: { type: boolean }
        updatedAt: { type: string }
    ServiceStatus:
      type: object
      required: [service, version]
      properties:
        service: { type: string, const: colab-server }
        version: { type: string }
    Error:
      type: object
      required: [code, message, retryable]
      properties:
        code: { type: string }
        message: { type: string }
        retryable: { type: boolean }
