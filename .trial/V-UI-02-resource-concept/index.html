<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Colab · Visual concept</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8f5;color:#17241d;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;cursor:pointer}aside{position:fixed;inset:0 auto 0 0;width:64px;background:#101a14;display:flex;align-items:center;flex-direction:column;gap:18px;padding:22px 0}.channel{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#dfe5dd;color:#17241d;font-size:12px}.active{background:#d9f542}.brand{color:#d9f542;font-size:24px;margin-bottom:18px}main{margin-left:64px}.top{padding:25px 34px 0;background:#fff;border-bottom:1px solid #dfe5dd}.heading{display:flex;justify-content:space-between;align-items:center;height:38px}.name{font-weight:600}.quiet{background:transparent;border:1px solid #dfe5dd;border-radius:6px;padding:7px 12px;color:inherit}.tabs{display:flex;gap:27px;margin-top:23px}.tabs button{border:0;background:none;padding:10px 0 14px;color:#66746a}.tabs button[aria-selected=true]{color:#17241d;border-bottom:2px solid #17241d}.body{padding:26px 34px;max-width:1320px;margin:auto}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;color:#66746a;font-size:12px}.primary{background:#d9f542;border:0;border-radius:6px;padding:8px 14px;color:#17241d;font-size:14px}.row{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:14px;align-items:center;padding:19px 4px;border-bottom:1px solid #e0e5df}.icon{width:16px;height:16px;stroke:#536357;stroke-width:1.4;fill:none}.title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;gap:15px;align-items:center;margin-top:5px;color:#758076;font-size:12px}.avatar{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#897a6f;color:white;font-size:10px;margin-right:5px}.action{background:none;border:0;color:#425849;padding:7px 10px;font-size:12px}.note{position:fixed;bottom:18px;right:24px;color:#758076;font-size:12px}.row:hover{background:#f0f3ed}.menu{color:#758076}.preview{display:none;background:#101a14;color:#e4e9e0;padding:24px;border-radius:8px;margin-top:20px}.preview.open{display:block}.preview button{float:right;color:#d9f542;background:none;border:0}@media(max-width:800px){.top{padding-inline:18px}.body{padding-inline:18px}.tabs{gap:16px}.meta{gap:8px}.source{display:none}}
</style>
<aside><div class="brand">△</div><div class="channel active">1C</div><div class="channel">JC</div><div class="channel">SC</div><div class="channel">FC</div></aside>
<main><header class="top"><div class="heading"><span class="name">1st channel</span><button class="quiet" onclick="showPreview('Quick Share · concept only')">Quick Share ↗</button></div><nav class="tabs"><button>Home</button><button>Messages</button><button aria-selected="true" onclick="selectTab(this,'sessions')">Sessions</button><button onclick="selectTab(this,'files')">Files</button><button>Skills</button><button>Canvas</button><button>Settings</button></nav></header>
<section class="body"><div class="toolbar"><span id="count">2 shared conversations</span><button class="primary" id="share" onclick="showPreview('Share · concept only')">+ Share a session</button></div><div id="list"></div><div class="preview" id="preview"><button onclick="this.parentElement.classList.remove('open')">Close</button><span id="previewText"></span><p>This is a visual concept. No backend requests or Agent commands are sent.</p></div></section></main><div class="note">Visual concept · not a product build</div>
<script>
const sessions=[['Generate and verify a sine wave with Python','Zhiyuan Yu','Codex','Oct 5, 20:14'],['Agent Colab architecture and open-source preparation','Zhiyuan Yu','Codex','Oct 5, 19:13']];
const files=[['AGENTS.md','Zhiyuan Yu','Markdown','Oct 6, 20:18'],['helium-cloud.png','Zhiyuan Yu','Image','Oct 1, 21:50'],['electron-cloud.png','Zhiyuan Yu','Image','Oct 1, 20:02']];
function render(items){document.getElementById('list').innerHTML=items.map(x=>`<div class="row"><svg class="icon" viewBox="0 0 20 20"><rect x="4" y="2" width="12" height="16" rx="1.5"/><path d="M7 6h6M7 10h6M7 14h4"/></svg><div><div class="title">${x[0]}</div><div class="meta"><span><span class="avatar">Z</span>${x[1]}</span><span class="source">${x[2]}</span><span>Synced ${x[3]}</span></div></div><div><button class="action" onclick="showPreview('Give to Agent · concept only')">Give to Agent ↗</button><button class="action menu" onclick="showPreview('More actions · concept only')">···</button></div></div>`).join('')}
function selectTab(el,type){document.querySelectorAll('.tabs button').forEach(b=>b.removeAttribute('aria-selected'));el.setAttribute('aria-selected','true');render(type==='sessions'?sessions:files);document.getElementById('count').textContent=type==='sessions'?'2 shared conversations':'3 shared files';document.getElementById('share').textContent=type==='sessions'?'+ Share a session':'+ Share files'}
function showPreview(text){document.getElementById('previewText').textContent=text;document.getElementById('preview').classList.add('open')}render(sessions);
</script></html>
