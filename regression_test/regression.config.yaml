schemaVersion: 1
caseDirectories:
  - cases
regressionDirectory: .runs
baseUrl: http://127.0.0.1:53482/embed
readySelector: '[aria-label="Channel items"]'
browser:
  mode: device
  profileDir: /Users/yuzhiyuan/.local/share/trace/browser-profiles/colab-regression-trial
targets:
  channel.rail: '[aria-label="Channels"]'
  messages.tab: '[aria-label="Channel items"] button:has-text("Message")'
prerequisites:
  local-core: true

environment:
  default: local
  adapter: environment/adapter.mjs
  profiles:
    local: environment/environment.local.yaml

# Reuse the project's registered operation roots and the installed Trace query layer.
telemetry:
  queryConfigParameter: traceQueryConfig
  queryConfigEnvironment: TRACE_CONFIG
  commandTraceparentEnvironment: COLAB_TRACEPARENT
  commandPathPrefix: skills/colab/bin/
  waitMs: 20000
  # Source CLI tests consume the same packaged OTel dependencies as the installed Skill.
  commandEnvironmentParameters:
    PYTHONPATH: tracePythonDependencyPath
  operationAttribute: colab.operation
  phaseAttribute: colab.phase
  outcomeAttribute: colab.outcome
  originAttribute: colab.origin
  originValues:
    gui: gui
    command: skill
