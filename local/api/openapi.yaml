openapi: 3.1.0
info:
  title: Colab Local API
  version: 0.1.0
paths:
  /v1/channels/{channelId}/catalog-items/position:
    patch:
      operationId: positionCatalogItem
      description: Atomically move an authorized item and insert before an optional direct sibling. Omitted before appends; null parentId moves to root. Stable item and consumer identities are unchanged.
      parameters:
        - {name: channelId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, itemId]
              properties:
                kind: {type: string, enum: [catalog, canvas, session, files, skill]}
                itemId: {type: string, format: uuid}
                parentId: {type: [string, 'null'], format: uuid}
                before:
                  type: object
                  required: [kind, itemId]
                  properties:
                    kind: {type: string, enum: [catalog, canvas, session, files, skill]}
                    itemId: {type: string, format: uuid}
      responses:
        '204': {description: Placement committed}
        '400': {description: Invalid or stale anchor, invalid destination, cycle or unavailable item; no partial move}
        '403': {description: Not authorized}
  /v1/skills/{shareId}/preview:
    get:
      operationId: previewLocalSkill
      description: Authorize and materialize the shared Skill, then read its bounded UTF-8 SKILL.md. Does not install or execute the Skill.
      parameters:
        - { name: shareId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Skill entry content
          content:
            application/json:
              schema:
                type: object
                required: [content]
                properties:
                  content: { type: string }
        "400": { description: Unsafe path or entry larger than 1 MiB }
        "403": { description: Current account has no access }
  /v1/auth/profile:
    get:
      operationId: getLocalAccountProfile
      description: Read current account profile and provider linkage; update local session projection without returning credentials.
      responses:
        "200": { description: "id, email, displayName, avatarUrl, nameCustomized, googleLinked" }
    patch:
      operationId: updateLocalAccountName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayName]
              properties:
                displayName: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "200": { description: Updated account profile }
        "400": { description: Empty, overlong or control-character name }
  /v1/canvases/{canvasId}/local-replica:
    get:
      operationId: readLocalCanvasReplica
      description: GUI-only hydration from the current account’s persisted Yrs replica. It includes unsent edits and never acknowledges Server delivery. Skill uses the document projection instead.
      parameters:
        - { name: canvasId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "base64 update, lastServerSeq and pending outbox count" }
        "404": { description: No persisted replica for the current account }
  /v1/shares/{shareId}/read-activity:
    post:
      operationId: recordLocalShareRead
      description: Report owner-local Files consumption that bypasses materialization. Best-effort metadata only, no task-facing output change.
      parameters:
        - { name: shareId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "recorded boolean; false never invalidates already consumed content" }
  /v1/channels/{channelId}/activity:
    get:
      operationId: listLocalChannelActivity
      description: Authorized recent activity with stable object identities and bounded rich instruction previews. Loads one bounded page, never shared resource bodies or task logs. Reuses Server cursor unchanged.
      parameters:
        - { name: channelId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: before, in: query, schema: { type: string, format: date-time } }
        - { name: beforeId, in: query, schema: { type: string } }
      responses:
        "200": { description: "items plus nullable nextCursor {before,beforeId}; newest first" }
        "403": { description: Caller is not a Channel member }
  /v1/system/update-progress:
    get:
      summary: Read current local artifact download progress
      responses:
        "200": { description: Update progress }
  /v1/system/restart:
    post:
      summary: Restart a managed Local Core after activated artifacts have been acknowledged
      responses:
        "202": { description: Restart accepted; caller should probe for a new process ID }
  /v1/status:
    get:
      operationId: getLocalStatus
      responses:
        "200":
          description: Local Core status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalStatus"
  /v1/channels/{channelId}/files:
    get:
      operationId: listLocalFileShares
      parameters:
        - { name: channelId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Files shared items enriched with this account's local path }
  /v1/channels/{channelId}/files/share:
    post:
      operationId: shareLocalFiles
      parameters:
        - { name: channelId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [localPath]
              properties:
                localPath: { type: string }
                name: { type: string }
                syncExcludes:
                  type: array
                  items: { type: string, enum: [node_modules, target, dist, build, .cache] }
      responses:
        "201": { description: Shared item registered and durable first-publication job accepted }
  /v1/files/inspect-source:
    post:
      operationId: inspectLocalFileSource
      responses:
        "200": { description: On-demand file counts, byte totals and generated-directory exclusion candidates }
  /v1/files/{shareId}/sync-scope:
    get:
      operationId: getFileSynchronizationScope
      responses:
        "200": { description: Scope calculated from the source tree and shadow Git info/exclude }
    patch:
      operationId: updateFileSynchronizationScope
      responses:
        "200": { description: Shadow Git info/exclude updated and a durable publication job enqueued }
  /v1/files/{shareId}/publish:
    post:
      operationId: publishLocalFileChanges
      responses:
        "200": { description: Source rescanned and changed objects published }
  /v1/files/{shareId}/materialize:
    post:
      operationId: materializeFileShare
      responses:
        "200": { description: Revision packs downloaded and current root materialized }
  /v1/files/{shareId}/tree:
    get:
      operationId: listMaterializedFileTree
      responses:
        "200": { description: Bounded recursive file tree from the local materialization }
  /v1/files/{shareId}/content:
    get:
      operationId: readMaterializedTextFile
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: UTF-8 text preview up to 1 MiB }
  /v1/files/{shareId}/raw:
    get:
      operationId: streamMaterializedFile
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Authenticated loopback byte stream for browser-native or local format preview
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /v1/session-sources:
    get:
      operationId: listLocalSessionSources
      parameters:
        - { name: q, in: query, required: false, schema: { type: string }, description: Case-insensitive title or thread/session ID search }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
      responses:
        "200": { description: Session metadata queried from the background-maintained SQLite catalog; no transcript scan occurs in this request }
  /v1/channels/{channelId}/sessions:
    get:
      operationId: listLocalSessionShares
      responses:
        "200": { description: Active shared Sessions enriched with local cache state }
  /v1/channels/{channelId}/sessions/share:
    post:
      operationId: shareLocalSession
      responses:
        "201": { description: Session registered; initial raw synchronization continues independently }
  /v1/sessions/{shareId}/read:
    post:
      operationId: readSharedSession
      responses:
        "200": { description: Snapshot-pinned normalized turns and opaque next cursor }
  /v1/channels/{channelId}/participants:
    get:
      operationId: listLocalChannelMessageParticipants
      responses:
        "200": { description: Channel members and selected Agent counts proxied without exposing remote credentials }
  /v1/channels/{channelId}/blueprints:
    get:
      operationId: listLocalAgentBlueprints
      responses:
        "200": { description: Organization-wide personal Agent list with Channel selection state }
    post:
      operationId: createLocalAgentBlueprint
      responses:
        "201": { description: Personal Agent blueprint created }
  /v1/channels/{channelId}/blueprints/{blueprintId}:
    patch:
      operationId: updateLocalAgentBlueprint
      responses:
        "200": { description: Owned Agent blueprint updated }
  /v1/channels/{channelId}/blueprints/{blueprintId}/selection:
    patch:
      operationId: setLocalChannelAgentSelection
      responses:
        "204": { description: Owned Agent Channel selection updated }
  /v1/channels/{channelId}/messages:
    get:
      operationId: listLocalChannelMessages
      responses:
        "200": { description: Cursor-paginated Channel messages }
    post:
      operationId: createLocalChannelMessage
      responses:
        "201": { description: Idempotent member message committed }
  /v1/messages/stream:
    get:
      operationId: streamLocalMessageInvalidations
      summary: Upgrade to a loopback WebSocket bridged to the authenticated Server stream
      responses:
        "101": { description: WebSocket protocol switched }
  /v1/skill-sources:
    get:
      operationId: listLocalSkillSources
      responses:
        "200": { description: Skill catalog filtered by content change time and Channel registration }
  /v1/channels/{channelId}/skills:
    get:
      operationId: listLocalSkillShares
      responses:
        "200": { description: Active shared Skills enriched with a local path when available }
  /v1/channels/{channelId}/skills/share:
    post:
      operationId: shareLocalSkill
      responses:
        "201": { description: Skill source registered and its first shadow-Git snapshot published }
  /v1/skills/{shareId}/materialize:
    post:
      operationId: materializeSharedSkill
      responses:
        "200": { description: Current Skill snapshot materialized into application data }
  /v1/skills/{shareId}/installations:
    get:
      operationId: listSharedSkillInstallations
      responses:
        "200": { description: Target receipt states including available updates and local conflicts }
  /v1/skills/{shareId}/targets/{target}/ensure:
    post:
      operationId: ensureSharedSkillInstalled
      responses:
        "200": { description: Skill installed or updated atomically }
        "409": { description: Target is unmanaged or locally modified }
  /v1/skills/{shareId}/targets/{target}:
    delete:
      operationId: uninstallSharedSkill
      responses:
        "204": { description: Managed unmodified installation removed }
        "409": { description: Installed Skill has local changes and was preserved }
  /v1/skills/{shareId}:
    delete:
      operationId: withdrawLocalSkillShare
      responses:
        "204": { description: Owned Skill withdrawn; consumer installations remain }
  /v1/transfers:
    get:
      operationId: listManagedQuickTransfers
      responses:
        "200": { description: Quick Shares created on this device, including active usage summaries }
    post:
      operationId: createLocalQuickTransfer
      summary: Freeze and upload exactly one local Files, Session, or Skill source
      responses:
        "201": { description: Read capability returned; management capability retained privately }
  /v1/transfers/{transferId}:
    get:
      operationId: getManagedQuickTransfer
      responses:
        "200": { description: Creator management view mediated by Local Core }
    patch:
      operationId: updateLocalQuickTransferExpiry
      responses:
        "200": { description: Expiry updated through the private revoke capability }
  /v1/transfers/revoke:
    post:
      operationId: revokeLocalQuickTransfer
      responses:
        "204": { description: Share revoked and local receipt retained for management history }
  /v1/transfers/receive:
    post:
      operationId: receiveQuickTransfer
      responses:
        "200": { description: Item streamed, verified, and atomically materialized in application data }
  /v1/channels/{channelId}/agent-runtimes:
    get:
      operationId: listLocalAgentRuntimes
      responses:
        "200": { description: Registered device + coding-agent runtime choices }
  /v1/channels/{channelId}/agent-requests:
    get:
      operationId: listLocalAgentRequests
      responses:
        "200": { description: Channel Agent task history including summary, createdAt, nullable startedAt, finishedAt and durationMs, proxied without exposing remote credentials }
    post:
      operationId: createLocalAgentRequest
      responses:
        "201": { description: Forwarded-message request created; ordinary rich-message mentions route server-side }
  /v1/agent-requests/{requestId}/context:
    get:
      operationId: readLocalAgentRequestContext
      responses:
        "200": { description: Older authorized messages for this request only }
  /v1/agent-requests/{requestId}/reply:
    post:
      operationId: replyToLocalAgentRequest
      responses:
        "201": { description: Result returned as the selected Channel Agent }
  /v1/channels/{channelId}/canvases:
    get:
      operationId: listLocalCanvases
      responses:
        "200": { description: Authorized Canvas metadata }
    post:
      operationId: createLocalCanvas
      responses:
        "201": { description: Canvas created }
  /v1/channels/{channelId}/canvas-folders:
    get:
      operationId: listLocalCanvasFolders
      responses:
        "200": { description: Authorized Canvas folders }
    post:
      operationId: createLocalCanvasFolder
      responses:
        "201": { description: Canvas folder created }
  /v1/canvases/{canvasId}:
    patch:
      operationId: renameLocalCanvas
      responses:
        "200": { description: Canvas renamed through the Server use case }
  /v1/canvas-folders/{folderId}:
    patch:
      operationId: renameLocalCanvasFolder
      responses:
        "200": { description: Canvas folder renamed through the Server use case }
  /v1/canvases/{canvasId}/updates:
    get:
      operationId: repairLocalCanvasReplica
      responses:
        "200": { description: Ordered updates after durable local outbox replay }
    post:
      operationId: saveLocalCanvasUpdate
      summary: Durably enqueue locally before attempting Server delivery
      responses:
        "201": { description: Update acknowledged by Server }
  /v1/canvases/{canvasId}/document:
    get:
      operationId: readCanvasMarkdownProjection
      responses:
        "200": { description: Deterministic virtual document.md projection and revision }
  /v1/canvases/{canvasId}/apply-patch:
    post:
      operationId: applyCanvasDocumentPatch
      summary: Apply a Codex Update File patch to the current document.md projection
      responses:
        "200": { description: Patch converted into a durable Yrs transaction }
        "409": { description: Context changed or the patch targets a structured component fence }
components:
  schemas:
    LocalStatus:
      type: object
      required: [service, version]
      properties:
        service: { type: string, const: colabd }
        version: { type: string }
