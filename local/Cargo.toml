[workspace]
members = ["crates/core", "crates/local-api", "crates/daemon"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "form", "query", "stream", "rustls", "system-proxy"] }
dotenvy = "0.15.7"
sha2 = "0.10.9"
hex = "0.4.3"
base64 = "0.22.1"
url = "2.5.8"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "fs", "io-util", "process"] }
tokio-util = { version = "0.7.17", features = ["io"] }
futures-util = "0.3.31"
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
serde_urlencoded = "0.7.1"
tower-http = { version = "0.7.1", features = ["cors", "fs"] }
mime_guess = "2.0.5"
uuid = { version = "1.26.1", features = ["v4"] }
rusqlite = { version = "0.38.0", features = ["bundled"] }
notify = "8.2.0"
directories = "6.0.0"
rfd = "0.15.4"
wait-timeout = "0.2.1"
yrs = "0.28.0"
