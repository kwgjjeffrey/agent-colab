[package]
name = "colab-observability"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace]

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8.9"
http = "1"
opentelemetry = { version = "0.33", features = ["trace"] }
opentelemetry_sdk = { version = "0.33", features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "query", "form", "stream", "rustls"] }
reqwest-middleware = { version = "0.5.2", features = ["json", "query", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
tracing-opentelemetry = "0.34"
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "trace"] }
prost = "0.14"
